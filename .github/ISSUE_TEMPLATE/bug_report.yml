name: Bug report
description: Something produced wrong results or failed
labels: [bug]
body:
  - type: dropdown
    id: layer
    attributes:
      label: Layer
      options: [tokenizer, model, training loop, sampling, experiments, web app]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and environment
      description: The exact command, Python version and operating system.
      render: shell
